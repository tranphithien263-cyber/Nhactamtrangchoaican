<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(180deg, #0a0015 0%, #1a0033 100%);
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 20px 16px;
  min-height: 100vh;
}
#botScreen { max-width: 500px; margin: 0 auto; }
.bot-icon {
  width: 90px; height: 90px; border-radius: 50%;
  background: linear-gradient(135deg, #a855f7, #ec4899);
  display: flex; align-items: center; justify-content: center;
  font-size: 50px; margin: 0 auto 18px;
  box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
}
.bot-msg {
  font-size: 18px; color: #fff; text-align: center;
  margin-bottom: 24px; line-height: 1.6;
  background: rgba(20, 10, 40, 0.6);
  border: 2px solid #a855f7;
  border-radius: 16px;
  padding: 20px;
}
.bot-btn {
  display: block; width: 100%;
  padding: 18px;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #1a0a30, #2d1a45);
  border: 2px solid #a855f7;
  border-radius: 16px;
  color: #fff;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  font-family: Arial;
}
.bot-btn:hover { border-color: #ec4899; background: linear-gradient(135deg, #2d1a45, #3d2a55); }
.bot-btn:active { opacity: 0.7; }

#musicScreen { display: none; max-width: 600px; margin: 0 auto; }
.back-home {
  background: #333;
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
  margin-bottom: 18px;
  font-family: Arial;
}
.screen-title {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  color: #ff9500;
  margin-bottom: 20px;
}
.song {
  display: block;
  padding: 16px;
  background: rgba(30, 20, 50, 0.7);
  border: 1px solid #a855f7;
  border-radius: 12px;
  margin-bottom: 10px;
  text-decoration: none;
  color: #fff;
}
.song:hover { background: rgba(50, 30, 80, 0.9); border-color: #ec4899; }
.song .t { font-size: 15px; font-weight: bold; margin-bottom: 5px; }
.song .a { font-size: 13px; color: #a855f7; }
.song .src {
  display: inline-block; font-size: 9px;
  padding: 2px 8px; border-radius: 4px;
  margin-left: 8px; font-weight: bold;
  vertical-align: middle;
}
.song .src.yt { background: rgba(255, 0, 0, 0.2); border: 1px solid #ff0000; color: #ff6b6b; }
.song .src.tk { background: rgba(0, 242, 234, 0.2); border: 1px solid #00f2ea; color: #00f2ea; }
</style>
</head>

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showMusic(mood) {
  var songs = [];
  var title = '';

  if (mood === 'sad') {
    songs = SONGS_SAD;
    title = '😔 NHẠC BUỒN';
  } else if (mood === 'happy') {
    songs = SONGS_HAPPY;
    title = '😄 NHẠC VUI';
  } else if (mood === 'chill') {
    songs = SONGS_CHILL;
    title = '😌 NHẠC CHILL';
  } else {
    songs = SONGS_SAD.concat(SONGS_HAPPY).concat(SONGS_CHILL);
    title = '🎵 TẤT CẢ NHẠC';
  }

  document.getElementById('musicTitle').textContent = title;

  var html = '';
  for (var i = 0; i < songs.length; i++) {
    var s = songs[i];
    var srcClass = s.platform === 'youtube' ? 'src yt' : 'src tk';
    var srcText = s.platform === 'youtube' ? 'YOUTUBE' : 'TIKTOK';

    html += '<a class="song" href="' + s.url + '" target="_blank" rel="noopener">' +
      '<div class="t">' + escapeHtml(s.title) + '<span class="' + srcClass + '">' + srcText + '</span></div>' +
      '<div class="a">' + escapeHtml(s.artist) + '</div>' +
      '</a>';
  }

  document.getElementById('songList').innerHTML = html;
  document.getElementById('botScreen').style.display = 'none';
  document.getElementById('musicScreen').style.display = 'block';
  window.scrollTo(0, 0);
}

function goHome() {
  document.getElementById('botScreen').style.display = 'block';
  document.getElementById('musicScreen').style.display = 'none';
  window.scrollTo(0, 0);
}

function setBotMessage(text) {
  document.getElementById('botMsg').innerHTML = text;
}

function showMoodButtons() {

    '<button class="bot-btn" id="btnAll">🎵 Xem tất cả nhạc</button>';

  document.getElementById('btnSad').addEventListener('click', function() {
    setBotMessage('😔 Thôi không sao đâu, cố lên nhé!<br><br>Mình gợi ý vài bài nhạc buồn cho bạn nghe nè:');
    showAfterMood('sad', '🎵 Nghe nhạc buồn');
  });

  document.getElementById('btnHappy').addEventListener('click', function() {
    setBotMessage('😄 Hôm nay có chuyện gì vui hả? Chia sẻ mình với!<br><br>Mình gợi ý vài bài nhạc vui cho bạn nè:');
    showAfterMood('happy', '🎵 Nghe nhạc vui');
  });

  document.getElementById('btnChill').addEventListener('click', function() {
    setBotMessage('😌 Chill thư giãn nha!<br><br>Mình gợi ý vài bài cho bạn thư giãn nè:');
    showAfterMood('chill', '🎵 Nghe nhạc chill');
  });

  document.getElementById('btnAll').addEventListener('click', function() {
    showMusic('all');
  });
}

function showAfterMood(mood, btnText) {
  var screen = document.getElementById('botScreen');
  var oldMsg = document.getElementById('botMsg').innerHTML;

    '<div class="bot-icon">🤖</div>' +

    '<button class="bot-btn" id="btnGo">' + btnText + '</button>' +
    '<button class="bot-btn" id="btnReset">↻ Chọn lại tâm trạng</button>';

  document.getElementById('btnGo').addEventListener('click', function() {
    showMusic(mood);
  });
